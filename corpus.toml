# Graphcal QA corpus manifest. See schema/README.md.
schema_version = 1

[[projects]]
id = "minimal-mass-budget"
path = "projects/minimal-mass-budget"
status = "active"
domain = "systems-engineering"
origin = "original-synthetic"
purpose = "Exercise corpus discovery, project loading, checking, and evaluation."

[[projects.cases]]
id = "nominal"
entry = "src/minimal_mass_budget/main.gcl"
expectation = { kind = "health-only" }

[[projects]]
id = "modular-power-budget"
path = "projects/modular-power-budget"
status = "active"
domain = "electrical-systems"
origin = "original-synthetic"
purpose = "Detect semantic drift in multi-file power-budget evaluation output."

[[projects.cases]]
id = "nominal"
entry = "src/modular_power_budget/main.gcl"

[projects.cases.expectation]
kind = "stability-baseline"
expected = "expected/nominal.json"
evidence = "reference/baseline.md"

[projects.cases.expectation.comparison]
mode = "semantic-json"
tolerances = []

[[projects]]
id = "ideal-rocket-equation"
path = "projects/ideal-rocket-equation"
status = "active"
domain = "propulsion"
origin = "source-backed"
purpose = "Reproduce the approximate mass ratio reported by NASA's ideal rocket equation example."

[[projects.cases]]
id = "mass-ratio-ten"
entry = "src/ideal_rocket_equation/main.gcl"

[projects.cases.expectation]
kind = "reference-backed"
evidence = "reference/calculation.md"

[[projects.cases.expectation.assertions]]
pointer = "/node/mass_ratio/si_value"
expected = 10.0
absolute_tolerance = 1.0
[[projects]]
id = "nasa-lift-sweep"
path = "projects/nasa-lift-sweep"
status = "active"
domain = "aerodynamics"
origin = "source-backed"
purpose = "Verify dynamic pressure, lift, and inverse speed against NASA's lift equation."

[[projects.cases]]
id = "three-flight-points"
entry = "src/nasa_lift_sweep/main.gcl"

[projects.cases.expectation]
kind = "reference-backed"
evidence = "reference/calculation.md"

[[projects.cases.expectation.assertions]]
pointer = "/node/cruise_dynamic_pressure/si_value"
expected = 980.0
absolute_tolerance = 1e-9

[[projects.cases.expectation.assertions]]
pointer = "/node/cruise_lift/si_value"
expected = 12700.8
absolute_tolerance = 1e-9

[[projects.cases.expectation.assertions]]
pointer = "/node/maximum_lift/si_value"
expected = 19845.0
absolute_tolerance = 1e-9

[[projects.cases.expectation.assertions]]
pointer = "/node/level_flight_speed/si_value"
expected = 38.88078956798696
absolute_tolerance = 1e-9

[[projects.cases.expectation.assertions]]
pointer = "/node/maximum_lift/unit"
expected = "kN"

