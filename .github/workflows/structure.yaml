name: Structural validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.x"
  UV_LOCKED: "1"
  UV_NO_SYNC: "1"

concurrency:
  group: structural-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate corpus structure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out corpus data
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: .python-version

      - name: Install the project
        run: uv sync

      - name: Test structural validator
        run: uv run -m pytest

      - name: Validate corpus structure
        run: uv run validate-corpus

  prek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out corpus data
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run pre-commit hooks
        uses: j178/prek-action@v3.1.0
        with:
          # Follow the prek version bundled with the action (updated by Renovate).
          prek-version: latest-known
          extra-args: --all-files
