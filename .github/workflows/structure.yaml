name: Structural validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: structural-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate corpus structure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out corpus data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.14"
          enable-cache: false

      - name: Test structural validator
        run: uv run --locked -m pytest

      - name: Validate corpus structure
        run: uv run --locked scripts/validate_corpus.py
